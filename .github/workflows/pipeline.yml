name: pipeline
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: pip install semgrep
      - run: semgrep scan --config p/javascript --error
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - run: node app.js &
      - run: curl --retry 10 --retry-connrefused --retry-delay 1 -sf "http://localhost:3000/total?p=10&c=2"
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000/total?p=10&c=2"
          allow_issue_writing: false      